<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa de luz : Smoothface's Epic</title>
<style>
  :root{
    --table:#4b4b4b; --table-2:#444; --ink:#111; --paper:#efe7d4; --paper-2:#e2d8bf;
    --ok:#3c7a4a; --bad:#a53c2e; --muted:#8c8578; --line:#b9b09a; --accent:#ffd166;
    font-size:15px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    background:var(--table); color:var(--ink);
    display:grid; grid-template-columns: 260px 1fr 340px; grid-template-rows: 48px 1fr;
    height:100vh;
  }
  header{grid-column:1/-1; background:var(--paper); border-bottom:3px solid var(--ink);
    display:flex; align-items:center; gap:18px; padding:0 16px}
  header h1{font-size:1.05rem; font-weight:normal; margin:0; letter-spacing:.02em}
  header .count{color:var(--muted)}
  header .tabs{margin-left:auto; display:flex; gap:4px}
  header .tabs button{font:inherit; border:2px solid var(--ink); background:transparent; padding:4px 10px; cursor:pointer}
  header .tabs button[aria-pressed=true]{background:var(--ink); color:var(--paper)}

  aside.list{background:var(--paper-2); border-right:3px solid var(--ink); overflow:auto}
  aside.list ul{list-style:none; margin:0; padding:0}
  aside.list li{padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; line-height:1.3}
  aside.list li .id{font-size:.9rem; word-break:break-all}
  aside.list li .k{color:var(--muted); font-size:.8rem}
  aside.list li[aria-current=true]{background:var(--paper); box-shadow: inset 4px 0 0 var(--ink)}
  aside.list li .mark{float:right; font-size:.8rem}
  aside.list li .mark.ok{color:var(--ok)} aside.list li .mark.bad{color:var(--bad)}

  main{display:flex; flex-direction:column; min-width:0; overflow:hidden}
  .stage{flex:1; display:flex; align-items:center; justify-content:center; gap:24px; padding:18px; overflow:auto; flex-wrap:wrap;
    background:
      linear-gradient(45deg,var(--table-2) 25%,transparent 25%,transparent 75%,var(--table-2) 75%),
      linear-gradient(45deg,var(--table-2) 25%,transparent 25%,transparent 75%,var(--table-2) 75%);
    background-size:24px 24px; background-position:0 0,12px 12px;}
  .stage figure{margin:0; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px}
  .stage figure img{display:block; image-rendering:auto; max-width:34vw; object-fit:contain}
  .stage figure.cand img{outline:3px solid var(--paper); outline-offset:6px}
  .stage figcaption{color:var(--paper); font-size:.8rem; max-width:26ch; word-break:break-word}
  .stage .empty{color:var(--paper); align-self:center; font-size:1.1rem}

  /* Interactive Assembled Rig Panel */
  .rig-card{
    background:rgba(30,30,30,0.88);
    border:3px solid var(--paper);
    padding:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color:var(--paper);
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .rig-title{
    font-size:.9rem;
    font-weight:bold;
    letter-spacing:.02em;
    display:flex;
    justify-content:space-between;
    width:100%;
    align-items:center;
    border-bottom:1px solid #666;
    padding-bottom:6px;
    gap:8px;
  }
  .rig-title span.sub{font-weight:normal; font-size:.75rem; color:#bbb}
  .rig-title button{
    font:inherit;
    font-size:.72rem;
    padding:2px 8px;
    border:1px solid #777;
    background:#2b2b2b;
    color:var(--paper);
    cursor:pointer;
  }
  .rig-title button.on{
    background:var(--accent);
    color:#111;
    border-color:var(--accent);
    font-weight:bold;
  }
  .rig-viewport-wrap{
    position:relative;
    overflow:hidden;
    background:
      linear-gradient(45deg,#3b3b3b 25%,transparent 25%,transparent 75%,#3b3b3b 75%),
      linear-gradient(45deg,#3b3b3b 25%,transparent 25%,transparent 75%,#3b3b3b 75%);
    background-color:#444;
    background-size:20px 20px;
    background-position:0 0,10px 10px;
    border:2px solid #777;
  }
  .rig-viewport{
    position:relative;
    width:340px;
    height:420px;
    transform-origin:top left;
    user-select:none;
  }
  .rig-layer{
    position:absolute;
    cursor:grab;
    user-select:none;
    -webkit-user-drag:none;
  }
  .rig-layer:active{cursor:grabbing}
  .rig-layer.active-part{
    filter: drop-shadow(0 0 4px #ffd166);
  }
  .rig-controls{
    display:grid;
    grid-template-columns: auto 1fr;
    gap:6px 10px;
    width:100%;
    font-size:.78rem;
    align-items:center;
    background:rgba(0,0,0,0.28);
    padding:8px 10px;
    border:1px solid #555;
  }
  .rig-controls .lbl{color:#ccc; font-weight:bold; white-space:nowrap}
  .rig-btns{display:flex; flex-wrap:wrap; gap:4px}
  .rig-btns button{
    font:inherit;
    font-size:.75rem;
    padding:2px 8px;
    border:1px solid #999;
    background:#2b2b2b;
    color:var(--paper);
    cursor:pointer;
  }
  .rig-btns button.on{
    background:var(--accent);
    color:#111;
    border-color:var(--accent);
    font-weight:bold;
  }
  .rig-btns button:hover{border-color:#fff}
  .rig-footer{
    font-size:.72rem;
    color:#bbb;
    display:flex;
    justify-content:space-between;
    width:100%;
    align-items:center;
  }
  .rig-footer button{
    font:inherit;
    font-size:.72rem;
    padding:2px 6px;
    background:#333;
    color:#ddd;
    border:1px solid #777;
    cursor:pointer;
  }

  .controls{background:var(--paper); border-top:3px solid var(--ink); padding:12px 16px; display:grid;
    grid-template-columns: auto 1fr auto auto; gap:10px; align-items:center}
  .controls label{color:var(--muted); font-size:.85rem}
  .controls input[type=range]{width:160px; vertical-align:middle}
  .controls textarea{font:inherit; width:100%; min-height:44px; resize:vertical; border:2px solid var(--ink); background:#fff; padding:6px 8px}
  .controls button{font:inherit; font-size:1rem; padding:10px 18px; border:2px solid var(--ink); cursor:pointer; background:#fff}
  .controls button.ok{background:var(--ok); color:#fff; border-color:var(--ok)}
  .controls button.bad{background:var(--bad); color:#fff; border-color:var(--bad)}
  .controls button:focus-visible, textarea:focus-visible, li:focus-visible{outline:3px solid #ffd166; outline-offset:2px}
  .controls .keys{grid-column:1/-1; color:var(--muted); font-size:.8rem}

  aside.info{background:var(--paper-2); border-left:3px solid var(--ink); overflow:auto; padding:14px; font-size:.9rem; line-height:1.4}
  aside.info h2{font-size:.95rem; margin:14px 0 6px; font-weight:normal; border-bottom:1px solid var(--line)}
  aside.info h2:first-child{margin-top:0}
  aside.info p{margin:4px 0}
  aside.info ul{padding-left:18px; margin:4px 0}
  .gate.ok::before{content:"✓ "; color:var(--ok)} .gate.bad::before{content:"✗ "; color:var(--bad)}
  .sev{font-size:.75rem; color:var(--muted)}
  .toast{position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:8px 14px; opacity:0; transition:opacity .2s; z-index:99}
  .toast.show{opacity:1}
  #shots{display:none; padding:20px; overflow:auto; color:var(--paper)}
  #shots img{max-width:100%; display:block; margin:8px 0 20px; outline:3px solid var(--paper); outline-offset:4px}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
  @media (max-width:1100px){ body{grid-template-columns:200px 1fr 280px} }
</style>
</head>
<body>
<header>
  <h1>Mesa de luz</h1>
  <span class="count" id="count">cargando…</span>
  <div class="tabs">
    <button id="tab-pieces" aria-pressed="true">Piezas + Marioneta</button>
    <button id="tab-shots" aria-pressed="false">Mosaico de expresiones / Cuarto</button>
    <button id="tab-all" aria-pressed="false" title="incluye aprobadas y rechazadas">Todo</button>
  </div>
</header>

<aside class="list"><ul id="list"></ul></aside>

<main>
  <section class="stage" id="stage"><p class="empty">No hay piezas esperando revisión.</p></section>
  <section id="shots"></section>
  <div class="controls" id="controls">
    <label>Escala de vista <input type="range" id="zoom" min="180" max="560" value="360"></label>
    <textarea id="reason" placeholder="Motivo (obligatorio para rechazar). Escribí lo que ves, con tus palabras: eso es lo que calibra a los críticos."></textarea>
    <button class="ok" id="btn-ok">Aprobar</button>
    <button class="bad" id="btn-bad">Rechazar</button>
    <div class="keys">Teclas: <b>A</b> aprobar · <b>R</b> escribir motivo y rechazar con <b>Ctrl+Enter</b> · <b>J</b>/<b>K</b> siguiente/anterior · <b>P</b> alternar marioneta · <b>1/2/3</b> ojos · <b>Q/W/E</b> cejas · <b>4/5/6</b> mano frontal · <b>7/8</b> mano trasera · <b>H</b> sombrero · <b>B</b> barba</div>
  </div>
</main>

<aside class="info" id="info"></aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  let items = [], allItems = [], idx = 0, reviews = {}, showAll = false;
  let activePuppet = 'smoothface';

  // Interactive Rig state for Smoothface
  const DEFAULT_OFFSETS = {
    shoe_back:        {x: 74,  y: 352, w: 84,  h: 59},
    leg_back:         {x: 78,  y: 320, w: 49,  h: 68},
    shoe_front:       {x: 112, y: 355, w: 84,  h: 59},
    leg_front:        {x: 118, y: 322, w: 40,  h: 68},
    pants:            {x: 78,  y: 282, w: 84,  h: 81},
    hand_back_fist:   {x: 272, y: 162, w: 48,  h: 42},
    hand_back_open:   {x: 272, y: 158, w: 46,  h: 46},
    hand_back_point:  {x: 272, y: 158, w: 58,  h: 42},
    arm_back:         {x: 172, y: 176, w: 131, h: 104},
    shoes_ref:        {x: 48,  y: 356, w: 129, h: 47},
    pants_ref:        {x: 75,  y: 306, w: 89,  h: 69},
    head:             {x: 132, y: 79,  w: 144, h: 151},
    eyes_normal:      {x: 175, y: 143, w: 72,  h: 58},
    eyes_squint:      {x: 174, y: 142, w: 81,  h: 60},
    eyes_closed:      {x: 175, y: 143, w: 78,  h: 58},
    brows_normal:     {x: 174, y: 132, w: 96,  h: 50},
    brows_angry:      {x: 178, y: 131, w: 84,  h: 59},
    brows_surprised:  {x: 179, y: 126, w: 76,  h: 57},
    torso:            {x: 27,  y: 90,  w: 255, h: 271},
    hand_front_fist:  {x: 254, y: 194, w: 41,  h: 44},
    hand_front_open:  {x: 252, y: 190, w: 48,  h: 48},
    hand_front_point: {x: 252, y: 192, w: 72,  h: 50},
    hand_ref:         {x: 137, y: 134, w: 162, h: 98},
    arm_front:        {x: 156, y: 210, w: 135, h: 108},
    arm_ref:          {x: 165, y: 219, w: 116, h: 90}
  };
  let rigOffsets = JSON.parse(JSON.stringify(DEFAULT_OFFSETS));
  let rigState = {
    eyes: 'normal',       // 'normal' | 'squint' | 'closed' | 'none'
    brows: 'normal',      // 'normal' | 'angry' | 'surprised' | 'none'
    handFront: 'fist',    // 'fist' | 'open' | 'point' | 'none'
    handBack: 'fist',     // 'fist' | 'open' | 'point' | 'none'
    bodyMode: 'l2b',      // 'l2b' (rig completo) | 'ref2010' (capas 2010) | 'both'
    collarFront: true,    // true = collar overlaps lower face, false = head in front of torso
    armBackXray: false,   // true = bring arm_back in front of torso
    highlightActive: true
  };

  // Interactive Rig state for Captain Dread
  const DEFAULT_CAPDREAD_OFFSETS = {
    boot_back         {x: 118, y: 388, w:  92, h:  65},
    leg_back          {x: 152, y: 332, w:  55, h:  76},
    boot_front        {x: 168, y: 395, w:  96, h:  68},
    leg_front         {x: 205, y: 336, w:  48, h:  78},
    pants             {x: 152, y: 288, w:  96, h:  92},
    hand_back_fist    {x:  82, y: 254, w:  50, h:  40},
    hand_back_open    {x:  80, y: 252, w:  50, h:  46},
    arm_back          {x:  68, y: 180, w:  76, h: 114},
    head              {x: 134, y:  74, w: 106, h: 138},
    eyes_normal       {x: 145, y: 122, w:  54, h:  37},
    eyes_squint       {x: 144, y: 124, w:  58, h:  26},
    eyes_closed       {x: 145, y: 122, w:  54, h:  37},
    brows_normal      {x: 140, y: 110, w:  64, h:  20},
    brows_angry       {x: 140, y: 106, w:  64, h:  28},
    brows_surprised   {x: 140, y: 103, w:  62, h:  34},
    hat               {x: 128, y:  40, w: 104, h: 116},
    torso             {x:  82, y: 148, w: 230, h: 236},
    beard             {x: 114, y: 132, w:  96, h:  92},
    hand_front_fist   {x: 222, y: 276, w:  48, h:  48},
    hand_front_open   {x: 220, y: 274, w:  52, h:  50},
    hand_front_point  {x: 202, y: 274, w:  72, h:  48},
    arm_front         {x: 218, y: 176, w:  58, h: 124}
  };
  let capdreadRigOffsets = JSON.parse(JSON.stringify(DEFAULT_CAPDREAD_OFFSETS));
  let capdreadRigState = {
    eyes: 'normal',       // 'normal' | 'closed' | 'squint' | 'none'
    brows: 'normal',      // 'normal' | 'angry' | 'surprised' | 'none'
    handFront: 'fist',    // 'fist' | 'open' | 'point' | 'none'
    handBack: 'fist',     // 'fist' | 'open' | 'none'
    hat: true,            // true | false
    beard: true,          // true | false
    highlightActive: true
  };

  const file = p => '/file/' + encodeURI(p);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); };

  async function load() {
    const [c, allC, r] = await Promise.all([
      fetch('/api/candidates' + (showAll ? '?all=1' : '')).then(x => x.json()),
      fetch('/api/candidates?all=1').then(x => x.json()),
      fetch('/api/reviews').then(x => x.json())]);
    items = c; allItems = allC; reviews = {};
    for (const v of r.reviews) reviews[v.id + '@' + v.version] = v;
    idx = Math.min(idx, Math.max(0, items.length - 1));
    syncRigToSelection();
    renderList(); renderStage();
  }

  function syncRigToSelection() {
    const it = items[idx];
    if (!it) return;
    if (it.id && it.id.startsWith('capdread.')) {
      activePuppet = 'capdread';
      if (it.id === 'capdread.eyes.normal') capdreadRigState.eyes = 'normal';
      else if (it.id === 'capdread.eyes.squint') capdreadRigState.eyes = 'squint';
      else if (it.id === 'capdread.eyes.closed') capdreadRigState.eyes = 'closed';
      else if (it.id === 'capdread.brows.normal') capdreadRigState.brows = 'normal';
      else if (it.id === 'capdread.brows.angry') capdreadRigState.brows = 'angry';
      else if (it.id === 'capdread.brows.surprised') capdreadRigState.brows = 'surprised';
      else if (it.id === 'capdread.hand_front.fist') capdreadRigState.handFront = 'fist';
      else if (it.id === 'capdread.hand_front.open') capdreadRigState.handFront = 'open';
      else if (it.id === 'capdread.hand_front.point') capdreadRigState.handFront = 'point';
      else if (it.id === 'capdread.hand_back.fist') capdreadRigState.handBack = 'fist';
      else if (it.id === 'capdread.hand_back.open') capdreadRigState.handBack = 'open';
      else if (it.id === 'capdread.hat') capdreadRigState.hat = true;
      else if (it.id === 'capdread.beard') capdreadRigState.beard = true;
    } else if (it.id && it.id.startsWith('smoothface.')) {
      activePuppet = 'smoothface';
      if (it.id === 'smoothface.eyes.normal') rigState.eyes = 'normal';
      else if (it.id === 'smoothface.eyes.squint') rigState.eyes = 'squint';
      else if (it.id === 'smoothface.eyes.closed') rigState.eyes = 'closed';
      else if (it.id === 'smoothface.brows.normal') rigState.brows = 'normal';
      else if (it.id === 'smoothface.brows.angry') rigState.brows = 'angry';
      else if (it.id === 'smoothface.brows.surprised') rigState.brows = 'surprised';
      else if (it.id === 'smoothface.hand_front.fist') rigState.handFront = 'fist';
      else if (it.id === 'smoothface.hand_front.open') rigState.handFront = 'open';
      else if (it.id === 'smoothface.hand_front.point') rigState.handFront = 'point';
      else if (it.id === 'smoothface.hand_back.fist') rigState.handBack = 'fist';
      else if (it.id === 'smoothface.hand_back.open') rigState.handBack = 'open';
      else if (it.id === 'smoothface.hand_back.point') rigState.handBack = 'point';
    }
  }

  function partImg(id, fallbackPath) {
    const found = allItems.find(x => x.id === id);
    return found ? found.image : fallbackPath;
  }

  function renderList() {
    const pending = items.filter(i => !reviews[i.id + '@' + i.version]).length;
    $('#count').textContent = items.length ? `${pending} pendientes de ${items.length}` : 'nada en la mesa';
    $('#list').innerHTML = items.map((i, n) => {
      const v = reviews[i.id + '@' + i.version];
      const mark = v ? `<span class="mark ${v.verdict==='approved'?'ok':'bad'}">${v.verdict==='approved'?'aprobada':'rechazada'}</span>` : '';
      return `<li tabindex="0" data-n="${n}" aria-current="${n===idx}">${mark}<div class="id">${esc(i.id)}</div><div class="k">${esc(i.kind||'')} · ${esc(i.version)}</div></li>`;
    }).join('');
    $('#list').querySelectorAll('li').forEach(li => li.onclick = () => {
      idx = +li.dataset.n;
      syncRigToSelection();
      renderList();
      renderStage();
    });
  }

  function buildSmoothfaceRigHTML(activeId, zoomH) {
    const scale = Math.max(0.55, Math.min(1.6, zoomH / 340));
    const wrapW = Math.round(340 * scale);
    const wrapH = Math.round(420 * scale);

    const torsoSrc = partImg('smoothface.torso', 'art/approved/smoothface/smoothface.torso.png');
    const headSrc  = partImg('smoothface.head', 'art/approved/smoothface/smoothface.head.png');
    const eyeSrcs = {
      normal: partImg('smoothface.eyes.normal', 'art/approved/smoothface/smoothface.eyes.normal.png'),
      squint: partImg('smoothface.eyes.squint', 'art/approved/smoothface/smoothface.eyes.squint.png'),
      closed: partImg('smoothface.eyes.closed', 'art/approved/smoothface/smoothface.eyes.closed.png')
    };
    const browSrcs = {
      normal:    partImg('smoothface.brows.normal', 'art/approved/smoothface/smoothface.brows.normal.png'),
      angry:     partImg('smoothface.brows.angry', 'art/approved/smoothface/smoothface.brows.angry.png'),
      surprised: partImg('smoothface.brows.surprised', 'art/approved/smoothface/smoothface.brows.surprised.png')
    };
    const shoeBackSrc  = partImg('smoothface.shoe_back',  'art/candidates/smoothface.shoe_back/v5.png');
    const shoeFrontSrc = partImg('smoothface.shoe_front', 'art/candidates/smoothface.shoe_front/v5.png');
    const legBackSrc   = partImg('smoothface.leg_back',   'art/approved/smoothface/smoothface.leg_back.png');
    const legFrontSrc  = partImg('smoothface.leg_front',  'art/approved/smoothface/smoothface.leg_front.png');
    const pantsSrc     = partImg('smoothface.pants',      'art/approved/smoothface/smoothface.pants.png');
    const armBackSrc   = partImg('smoothface.arm_back',   'art/candidates/smoothface.arm_back/v4.png');
    const armFrontSrc  = partImg('smoothface.arm_front',  'art/approved/smoothface/smoothface.arm_front.png');
    const handFrontSrcs = {
      fist:  partImg('smoothface.hand_front.fist',  'art/candidates/smoothface.hand_front.fist/v3.png'),
      open:  partImg('smoothface.hand_front.open',  'art/candidates/smoothface.hand_front.open/v4.png'),
      point: partImg('smoothface.hand_front.point', 'art/candidates/smoothface.hand_front.point/v4.png')
    };
    const handBackSrcs = {
      fist:  partImg('smoothface.hand_back.fist',  'art/candidates/smoothface.hand_back.fist/v2.png'),
      open:  partImg('smoothface.hand_back.open',  'art/candidates/smoothface.hand_back.open/v3.png'),
      point: partImg('smoothface.hand_back.point', 'art/candidates/smoothface.hand_back.point/v2.png')
    };

    const layers = [];
    if (rigState.bodyMode === 'ref2010' || rigState.bodyMode === 'both') {
      const op = rigState.bodyMode === 'both' ? 0.45 : 0.9;
      layers.push({key:'shoes_ref', pid:'', src:'art/references/ref_cutout_layers/002_shoes.png', z:5, opacity:op});
      layers.push({key:'pants_ref', pid:'', src:'art/references/ref_cutout_layers/003_pants.png', z:6, opacity:op});
    }
    if (rigState.bodyMode === 'l2b' || rigState.bodyMode === 'both') {
      layers.push({key:'shoe_back',  pid:'smoothface.shoe_back',  src:shoeBackSrc,  z:10, opacity:1});
      layers.push({key:'leg_back',   pid:'smoothface.leg_back',   src:legBackSrc,   z:11, opacity:1});
      layers.push({key:'shoe_front', pid:'smoothface.shoe_front', src:shoeFrontSrc, z:12, opacity:1});
      layers.push({key:'leg_front',  pid:'smoothface.leg_front',  src:legFrontSrc,  z:13, opacity:1});

  function wireRigEvents() {
    const vp = $('#rig-viewport');
    if (!vp) return;

    const tSf = $('#puppet-toggle-sf');
    if (tSf) tSf.onclick = () => { activePuppet = 'smoothface'; renderStage(); };
    const tCd = $('#puppet-toggle-cd');
    if (tCd) tCd.onclick = () => { activePuppet = 'capdread'; renderStage(); };

    document.querySelectorAll('[data-rig-puppet]').forEach(b => {
      b.onclick = () => {
        const puppet = b.dataset.rigPuppet;
        const g = b.dataset.rigGroup, v = b.dataset.rigVal;
        if (puppet === 'capdread') {
          capdreadRigState[g] = v;
        } else {
          rigState[g] = v;
        }
        renderStage();
      };
    });

    const tx = $('#rig-toggle-xray');
    if (tx) tx.onclick = () => { rigState.armBackXray = !rigState.armBackXray; renderStage(); };
    const th = $('#rig-toggle-hi');
    if (th) {
      th.onclick = () => {
        if (activePuppet === 'capdread') {
          capdreadRigState.highlightActive = !capdreadRigState.highlightActive;
        } else {
          rigState.highlightActive = !rigState.highlightActive;
        }
        renderStage();
      };
    }
    const that = $('#rig-toggle-hat');
    if (that) that.onclick = () => { capdreadRigState.hat = !capdreadRigState.hat; renderStage(); };
    const tbeard = $('#rig-toggle-beard');
    if (tbeard) tbeard.onclick = () => { capdreadRigState.beard = !capdreadRigState.beard; renderStage(); };

    const rs = $('#rig-reset');
    if (rs) {
      rs.onclick = () => {
        if (activePuppet === 'capdread') {
          capdreadRigOffsets = JSON.parse(JSON.stringify(DEFAULT_CAPDREAD_OFFSETS));
        } else {
          rigOffsets = JSON.parse(JSON.stringify(DEFAULT_OFFSETS));
        }
        renderStage();
      };
    }

    // Dragging support on rig layers
    const baseW = activePuppet === 'capdread' ? 360 : 340;
    const scale = Math.max(0.55, Math.min(1.6, $('#zoom').value / baseW));
    vp.querySelectorAll('.rig-layer').forEach(img => {
      img.onmousedown = e => {
        e.preventDefault();
        const key = img.dataset.key;
        const isCap = img.dataset.puppet === 'capdread';
        const offsets = isCap ? capdreadRigOffsets : rigOffsets;
        if (!offsets[key]) return;
        const startX = e.clientX, startY = e.clientY;
        const origX = offsets[key].x, origY = offsets[key].y;
        const coordsEl = $('#rig-coords');
        const onMove = ev => {
          const dx = Math.round((ev.clientX - startX) / scale);
          const dy = Math.round((ev.clientY - startY) / scale);
          offsets[key].x = origX + dx;
          offsets[key].y = origY + dy;
          img.style.left = offsets[key].x + 'px';
          img.style.top = offsets[key].y + 'px';
          if (coordsEl) coordsEl.textContent = `${key}: x=${offsets[key].x}, y=${offsets[key].y}`;
        };
        const onUp = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };
    });
  }

  function renderStage() {
    const st = $('#stage'), info = $('#info'), it = items[idx];
    if (!it) { st.innerHTML = '<p class="empty">No hay piezas esperando revisión.</p>'; info.innerHTML=''; return; }
    const h = +$('#zoom').value;
    const isSmoothfacePart = it.category === 'smoothface' || (it.id && it.id.startsWith('smoothface.'));
    const isCapdreadPart   = it.category === 'capdread'   || (it.id && it.id.startsWith('capdread.'));
    const isCharPart       = isSmoothfacePart || isCapdreadPart;

    // Respect real relative height for small body parts
    const candH = isCharPart && it.target_height_px
      ? Math.max(90, Math.round(it.target_height_px * (h / 220)))
      : h;

    const fig = (src, cap, cls='', customH=h) =>
      `<figure class="${cls}"><img src="${file(src)}" style="height:${customH}px" alt=""><figcaption>${esc(cap)}</figcaption></figure>`;

    const refs = (it.references||[]).slice(0,2).map(r => fig(r, 'ref · ' + r.split('/').pop(), '', Math.round(h * 0.78)));
    const rigHTML = activePuppet === 'capdread' ? buildCapdreadRigHTML(it.id, h) : buildSmoothfaceRigHTML(it.id, h);
    const neigh = isCharPart ? [] : (it.neighbors||[]).slice(0,2).map(r => fig(r, 'aprobada · ' + r.split('/').pop()));

    st.innerHTML = rigHTML + fig(it.image, `${it.id} · ${it.version} (pieza aislada)`, 'cand', candH) + refs.join('') + neigh.join('');
    wireRigEvents();

    $('#reason').value = (reviews[it.id+'@'+it.version]||{}).reason || '';

    const g = it.gates;
    const gates = g ? Object.keys(g).filter(k=>k.endsWith('_ok')).map(k => {
      const base = k.replace('_ok','');
      const extra = g[base+'_fraction']!==undefined ? g[base+'_fraction'] : (base==='ink' && g.ink_thickness_px!==undefined ? `${g.ink_thickness_px}px [${(g.ink_range||[]).join('-')}]` : '');
      return `<li class="gate ${g[k]?'ok':'bad'}">${base}${extra!==''?' <span class="sev">'+extra+'</span>':''}</li>`;
    }).join('') : '<li>sin gates</li>';
    const critic = c => !c ? '<p class="sev">no corrió</p>' :
      (c.defects&&c.defects.length ? '<ul>'+c.defects.map(d=>`<li>${esc(d.zone)}: ${esc(d.what)} <span class="sev">${esc(d.severity)}</span></li>`).join('')+'</ul>'
       : `<p>${esc(c.verdict)}</p>`);
    info.innerHTML = `
      <h2>Qué debería ser</h2><p>${esc(it.what)||'<i>sin descripción</i>'}</p>
      ${it.target_height_px?`<p class="sev">alto objetivo ${it.target_height_px}px${g&&g.measured_height_px?' · medido '+g.measured_height_px+'px':''}</p>`:''}
      ${it.last_rejection?`<h2>Tu rechazo anterior (${esc(it.last_rejection.version)})</h2><p>“${esc(it.last_rejection.reason)}”</p>`:''}
      <h2>Gates</h2><ul>${gates}</ul>
      <h2>Crítico de estilo</h2>${critic(it.critic_style)}
      <h2>Crítico de anatomía</h2>${critic(it.critic_anatomy)}`;
  }

  async function verdict(v) {
    const it = items[idx]; if (!it) return;
    const reason = $('#reason').value.trim();
    if (v === 'rejected' && !reason) { toast('Un rechazo necesita motivo.'); $('#reason').focus(); return; }
    const r = await fetch('/api/review', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id: it.id, version: it.version, verdict: v, reason})}).then(x=>x.json());
    if (r.error) { toast(r.error); return; }
    reviews[it.id+'@'+it.version] = {verdict:v, reason};
    toast(v === 'approved' ? 'Aprobada' : 'Rechazada');
    const next = items.findIndex((x,n) => n>idx && !reviews[x.id+'@'+x.version]);
    idx = next >= 0 ? next : idx;
    syncRigToSelection();
    renderList(); renderStage();
  }

  $('#btn-ok').onclick = () => verdict('approved');
  $('#btn-bad').onclick = () => verdict('rejected');
  $('#zoom').oninput = renderStage;
  document.addEventListener('keydown', e => {
    const inText = e.target.tagName === 'TEXTAREA';
    if (inText && e.key === 'Enter' && (e.ctrlKey||e.metaKey)) { e.preventDefault(); verdict('rejected'); return; }
    if (inText) return;
    if (e.key === 'a' || e.key === 'A') verdict('approved');
    if (e.key === 'r' || e.key === 'R') { $('#reason').focus(); }
    if (e.key === 'j' || e.key === 'J') { idx = Math.min(items.length-1, idx+1); syncRigToSelection(); renderList(); renderStage(); }
    if (e.key === 'k' || e.key === 'K') { idx = Math.max(0, idx-1); syncRigToSelection(); renderList(); renderStage(); }
    if (e.key === 'p' || e.key === 'P') {
      activePuppet = activePuppet === 'smoothface' ? 'capdread' : 'smoothface';
      renderStage();
      return;
    }
    if (activePuppet === 'capdread') {
      if (e.key === '1') { capdreadRigState.eyes = 'normal'; renderStage(); }
      if (e.key === '2') { capdreadRigState.eyes = 'squint'; renderStage(); }
      if (e.key === '3') { capdreadRigState.eyes = 'closed'; renderStage(); }
      if (e.key === '4') { capdreadRigState.handFront = 'fist'; renderStage(); }
      if (e.key === '5') { capdreadRigState.handFront = 'open'; renderStage(); }
      if (e.key === '6') { capdreadRigState.handFront = 'point'; renderStage(); }
      if (e.key === '7') { capdreadRigState.handBack = 'fist'; renderStage(); }
      if (e.key === '8') { capdreadRigState.handBack = 'open'; renderStage(); }
      if (e.key === 'q' || e.key === 'Q') { capdreadRigState.brows = 'normal'; renderStage(); }
      if (e.key === 'w' || e.key === 'W') { capdreadRigState.brows = 'angry'; renderStage(); }
      if (e.key === 'e' || e.key === 'E') { capdreadRigState.brows = 'surprised'; renderStage(); }
      if (e.key === 'h' || e.key === 'H') { capdreadRigState.hat = !capdreadRigState.hat; renderStage(); }
      if (e.key === 'b' || e.key === 'B') { capdreadRigState.beard = !capdreadRigState.beard; renderStage(); }
    } else {
      if (e.key === '1') { rigState.eyes = 'normal'; renderStage(); }
      if (e.key === '2') { rigState.eyes = 'squint'; renderStage(); }
      if (e.key === '3') { rigState.eyes = 'closed'; renderStage(); }
      if (e.key === '4') { rigState.handFront = 'fist'; renderStage(); }
      if (e.key === '5') { rigState.handFront = 'open'; renderStage(); }
      if (e.key === '6') { rigState.handFront = 'point'; renderStage(); }
      if (e.key === '7') { rigState.handBack = 'fist'; renderStage(); }
      if (e.key === '8') { rigState.handBack = 'open'; renderStage(); }
      if (e.key === 'q' || e.key === 'Q') { rigState.brows = 'normal'; renderStage(); }
      if (e.key === 'w' || e.key === 'W') { rigState.brows = 'angry'; renderStage(); }
      if (e.key === 'e' || e.key === 'E') { rigState.brows = 'surprised'; renderStage(); }
    }
  });

  function tab(which) {
    $('#tab-pieces').setAttribute('aria-pressed', which==='pieces');
    $('#tab-shots').setAttribute('aria-pressed', which==='shots');
    $('#tab-all').setAttribute('aria-pressed', which==='all');
    $('#stage').style.display = which==='shots' ? 'none' : 'flex';
    $('#controls').style.display = which==='shots' ? 'none' : 'grid';
    $('#shots').style.display = which==='shots' ? 'block' : 'none';
    showAll = which === 'all';
    if (which === 'shots') loadShots(); else load();
  }
  $('#tab-pieces').onclick = () => tab('pieces');
  $('#tab-shots').onclick = () => tab('shots');
  $('#tab-all').onclick = () => tab('all');

  async function loadShots() {
    const runs = await fetch('/api/shots').then(x=>x.json());
    if (!runs.length) {
      $('#shots').innerHTML = '<p>Todavía no hay vistas del cuarto. El skill room-layout las deja en review/layout_shots/.</p>';
      return;
    }
    $('#shots').innerHTML = runs.map(r => `
      <div style="margin-bottom:30px">
        <h2 style="border-bottom:1px solid #777; padding-bottom:6px; margin-top:16px">${esc(r.run)}</h2>
        <div style="display:flex; flex-direction:column; gap:16px">
          ${r.images.map(i => {
            const name = i.split('/').pop();
            return `<div>
              <div style="font-weight:bold; margin-bottom:4px; font-size:.85rem">${esc(name)}</div>
              <img src="${file(i)}" alt="${esc(name)}" style="max-width:100%; display:block; outline:3px solid var(--paper); outline-offset:4px">
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('');
  }

  load();
})();
</script>
</body>
</html>
